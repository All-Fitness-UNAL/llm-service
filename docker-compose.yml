services:
  redis:
    image: redis:7-alpine
    container_name: allfitness-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-gateway-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allfitness-ai-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - WORKER_COUNT=5
      - REDIS_ADDR=redis:6379
      - REDIS_TASK_QUEUE=allfitness:tasks:queue
      - REDIS_RESULT_PREFIX=allfitness:results:
      - REDIS_RESULT_TTL=15m
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_PRIMARY_MODEL=anthropic/claude-3.5-sonnet
      - OPENROUTER_FALLBACK_MODEL=openai/gpt-4o-mini
      - MOCK_OPENROUTER=${MOCK_OPENROUTER:-false}
    restart: unless-stopped

volumes:
  redis_data:
